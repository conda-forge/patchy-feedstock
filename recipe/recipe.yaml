schema_version: 1

context:
  name: patchy
  version: "3.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/patchy-${{ version }}.tar.gz
  sha256: 7a578df85d81d67b4ef8a1e25538a6bd7c002f6259ca01aeb6fb27d4e89dc5fa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.12.1,<0.13
  run:
    - python >=${{ python_min }}
    - unipatch

tests:
  - python:
      imports:
        - patchy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Patch the inner source of python functions at runtime.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/adamchainz/patchy

extra:
  recipe-maintainers:
    - thewchan
